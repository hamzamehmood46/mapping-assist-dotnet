name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Mapping.sln -c Release

  # Pages serves the gh-pages branch, so the build is committed there instead of using deploy-pages.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish the Blazor app
        run: dotnet publish src/Mapping.Web -c Release -o out
      - name: Point the app at its GitHub Pages path
        run: |
          sed -i 's|<base href="/" />|<base href="/mapping-assist-dotnet/" />|' out/wwwroot/index.html
          touch out/wwwroot/.nojekyll
          cp out/wwwroot/index.html out/wwwroot/404.html
      - name: Push the build to gh-pages
        working-directory: out/wwwroot
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the Blazor build for GitHub Pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
